[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyoanime"
dynamic = ["version"]
description = "Terminal-based anime streaming with Arabic and English sources"
readme = "README.md"
license = "GPL-3.0"
authors = [
    {name = "NoBy"}
]
maintainers = [
    {name = "NoBy"}
]
keywords = ["anime", "streaming", "cli", "arabic", "english", "sub", "dub", "subtitles", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Environment :: Console",
]
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",          # Terminal UI framework
    "requests>=2.31.0",      # HTTP client for API communication
    "pypresence>=4.5.0",     # Discord Rich Presence integration
    "Pillow>=10.0.0",        # Image processing for anime posters
    "numpy>=1.24.0",         # Array operations for image display
    "curl-cffi>=0.7.0",      # Browserless TLS impersonation client
    "beautifulsoup4>=4.12.0",# HTML parsing
    "arabic-reshaper>=3.0.0",# Arabic character shaping
    "python-bidi>=0.6.0",    # BiDi right-to-left layout
    "pycryptodome>=3.18.0",  # Crypto operations for stream decryption
]
# External tools (auto-installed by deps.py):
# - mpv: Media player for streaming episodes
# - ffmpeg: Multimedia framework (helper for mpv)

[project.scripts]
nyoanime = "nyoanime.app:main"
nyo = "nyoanime.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nyoanime*"]

[tool.setuptools.dynamic]
version = {attr = "nyoanime.version.__version__"}

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "*.db"]
